font_family FiraCode Nerd Font
font_size   11.0
shell       /usr/bin/zsh

# Ligatures, except under the cursor while editing
disable_ligatures cursor

scrollback_lines         20000
enable_audio_bell        no
copy_on_select           clipboard
confirm_os_window_close  0
window_padding_width     6

# Slightly translucent; Hyprland blurs what's behind
background_opacity 0.95

cursor_shape          beam
cursor_trail          3
cursor_trail_decay    0.1 0.3

tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"

# New windows/tabs open in the current directory
map kitty_mod+enter launch --cwd=current --type=window
map kitty_mod+t     launch --cwd=current --type=tab

include theme.conf
