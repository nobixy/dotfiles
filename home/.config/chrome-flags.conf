# Hardware video decode on NVIDIA (VA-API via libva-nvidia-driver; LIBVA_DRIVER_NAME set in hypr/modules/env.lua).
# If videos turn black/green, delete this file and restart Chrome.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks
