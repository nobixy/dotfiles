# hyprlock: lock screen in the rice palette. Test with SUPER+L.
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# (`##` is a literal `#` inside values.)

$font = FiraCode Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    color = rgba(11111bff)
    blur_passes = 2
    blur_size = 6
    brightness = 0.7
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"<b>%-I:%M</b>"
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(33ccffff)
    font_size = 20
    font_family = $font
    shadow_passes = 1
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = 12

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(1e1e2ed9)
    font_color = rgb(cdd6f4)
    font_family = $font

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">󰌾  Password</span>
    check_color = rgba(f9e2afee)
    fail_color = rgba(f38ba8ee)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(f9e2afee)

    position = 0, -40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = 󰀄  $USER
    color = rgba(a6adc8ff)
    font_size = 13
    font_family = $font
    position = 0, -105
    halign = center
    valign = center
}
