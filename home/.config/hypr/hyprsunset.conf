# hyprsunset: warmer screen in the evening. Screenshots/recordings are unaffected.
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
# ALT+T then n forces it on until pressed again (or the next profile starts).

profile {
    time = 7:00
    identity = true
}

profile {
    time = 21:00
    temperature = 4500
}
