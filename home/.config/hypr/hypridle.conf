# hypridle: lock after 10 min idle, screens off a minute later.
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# No automatic suspend: Antigravity runs scheduled agent jobs, which need the
# machine awake. Uncomment the last listener if you want it anyway.
# Fullscreen video/games and Waybar's coffee toggle pause all of this.

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh                               # single hyprlock instance
    before_sleep_cmd = loginctl lock-session                                # lock before any suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # no double key press on wake
    inhibit_sleep = 3                                                       # sleep only once the lock is drawn
}

listener {
    timeout = 600                        # 10 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                        # 11 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

