# tmux: prefix C-a, vim keys, rice palette (Catppuccin Mocha + cyan/green).
# Self-contained, no plugins. Reload with prefix r. See `man tmux`.

# --- Prefix ---
# C-a: ALT is Hyprland's leader, C-Space accepts zsh suggestions, Space is Neovim's leader
unbind C-b
set -g prefix C-a
bind -N "Send a literal C-a" C-a send-prefix          # C-a C-a sends a literal C-a (start of line in the shell)
bind -N "Previous window (last used)" a last-window            # C-a a: back to the previous window

# --- Terminal ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB"   # true colour
set -s escape-time 0          # Esc reaches Neovim instantly
set -g focus-events on
set -s set-clipboard on       # OSC 52: copies also reach the system clipboard

# Kitty graphics passthrough, for yazi image previews inside tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- General ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 4000      # messages stay up long enough to read
set -g status-interval 5
set -g status-keys emacs      # plain line editing in the C-a : prompt
setw -g aggressive-resize on

# --- Copy mode (C-a [): v select, C-v block, y yank to the Wayland clipboard ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# Paste from the Wayland clipboard
bind -N "Paste the Wayland clipboard" p run "wl-paste -n | tmux load-buffer - && tmux paste-buffer"

# --- Windows and panes ---
# Binds carry a note (-N): C-a / describes a key, and the Hyprland which-key
# overlay lists them when kitty is focused (hold ALT)
bind -N "Previous window" C-p previous-window      # hold Ctrl: C-a C-p / C-a C-n
bind -N "Next window" C-n next-window

# Move between panes with h/j/k/l, resize with H/J/K/L (repeatable)
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R
bind -r -N "Resize pane left (repeat)" H resize-pane -L 5
bind -r -N "Resize pane down (repeat)" J resize-pane -D 5
bind -r -N "Resize pane up (repeat)" K resize-pane -U 5
bind -r -N "Resize pane right (repeat)" L resize-pane -R 5

# Splits and new windows open in the current directory
bind -N "Split below" s split-window -v -c "#{pane_current_path}"
bind -N "Split right" v split-window -h -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Status bar and borders ---
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#33ccff,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#33ccff] "

set -g status-right-length 100
set -g status-right "#[fg=#45475a]│ #[fg=#00ff99,bold]%H:%M #[fg=#45475a]│ #[fg=#33ccff,bold]%Y-%m-%d #[bg=#00ff99,fg=#11111b,bold] #h "

set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#33ccff,bold] #I:#W* #[bg=#1e1e2e]"
set -g window-status-separator ""

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#33ccff"
set -g message-style "bg=#313244,fg=#33ccff"
set -g message-command-style "bg=#313244,fg=#00ff99"
