# User overrides for makepkg (AUR builds via yay). Read after /etc/makepkg.conf.

# Build with every core instead of one
MAKEFLAGS="-j$(nproc)"

# Same as the system default, minus `debug`: no separate *-debug packages
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

# Compress built packages with all cores
COMPRESSZST=(zstd -c -T0 -)
